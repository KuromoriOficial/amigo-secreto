name: Publicar Amigo Secreto no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run build:pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_API_ORIGIN: ${{ vars.AMIGO_API_ORIGIN || 'https://amigo-secreto-encontro-2026.andretoshiro.chatgpt.site' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publicar
        id: publish
        uses: actions/deploy-pages@v4
